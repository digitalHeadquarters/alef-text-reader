<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16a34a">
<title>Alef's Text Reader — Phone Edition</title>
<style>
  :root{--green:#16a34a;--green-dark:#14532d;--bg:#f6f8f6;--card:#fff;--ink:#1f2937;--muted:#6b7280;--border:#e5e7eb}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:16px 12px}
  .wrap{max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .logo{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;flex-shrink:0}
  h1{font-size:19px;color:var(--green-dark);line-height:1.15}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
  textarea{width:100%;min-height:180px;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:16px;line-height:1.55;resize:vertical;font-family:inherit;color:var(--ink);background:#fdfdfd}
  textarea:focus{outline:2px solid var(--green);border-color:transparent}
  .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  button{border:none;border-radius:999px;padding:13px 18px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s,opacity .15s;flex:1;min-width:90px}
  button:active{transform:scale(.97)}
  .btn-play{background:var(--green);color:#fff}.btn-play:hover{opacity:.9}
  .btn-stop{background:#ef4444;color:#fff}.btn-stop:hover{opacity:.9}
  .btn[disabled]{opacity:.5;cursor:wait}
  .row{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
  .field{flex:1;min-width:130px}
  select{padding:11px 10px;border-radius:10px;border:1px solid var(--border);font-size:15px;background:#fff;width:100%}
  .range-wrap{display:flex;align-items:center;gap:10px}
  .range-wrap input{flex:1;accent-color:var(--green);height:34px}
  .range-val{font-size:13px;font-weight:700;color:var(--green-dark);min-width:36px;text-align:right}
  .status{margin-top:12px;font-size:14px;color:var(--muted);min-height:20px;word-break:break-word}
  .status .ok{color:var(--green-dark);font-weight:600}
  .status .err{color:#dc2626;font-weight:600}
  .status .warn{color:#b45309;font-weight:600}
  .sample{background:#f0fdf4;border:1px dashed var(--green);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--green-dark);cursor:pointer;margin-top:12px}
  .sample:hover{background:#dcfce7}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
  .progress{height:4px;background:var(--border);border-radius:2px;margin-top:10px;overflow:hidden;display:none}
  .progress .bar{height:100%;background:var(--green);width:0%;transition:width .3s}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">📖</div>
    <div><h1>Alef's Text Reader</h1><div class="sub">Phone edition · works anywhere, no setup</div></div>
  </header>
  <div class="card">
    <label for="text">Your text</label>
    <textarea id="text" placeholder="Paste any long text here..."></textarea>
    <div class="sample" onclick="loadSample()">✨ Try a sample — tap to load, then press Listen</div>
    <div class="controls">
      <button class="btn-play" id="playBtn" onclick="speak()">▶ Listen</button>
      <button class="btn-stop" onclick="stop()">■ Stop</button>
      <button class="btn-play" style="background:#f3f4f6;color:var(--ink);border:1px solid var(--border)" onclick="clearAll()">Clear</button>
    </div>
    <div class="row">
      <div class="field">
        <label for="voice">Voice</label>
        <select id="voice">
          <option value="en-GB">British English</option>
          <option value="en-US">American English</option>
          <option value="en-NG">Nigerian English</option>
          <option value="en-AU">Australian English</option>
        </select>
      </div>
      <div class="field">
        <label for="rate">Speed</label>
        <div class="range-wrap">
          <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.95">
          <span class="range-val" id="rateVal">0.95×</span>
        </div>
      </div>
    </div>
    <div class="progress" id="progressWrap"><div class="bar" id="progressBar"></div></div>
    <div class="status" id="status">Ready.</div>
  </div>
  <div class="foot">Made for Frederick 💚 · Add to home screen: browser menu → "Add to Home Screen"</div>
</div>
<script>
  const textEl=document.getElementById('text'), voiceEl=document.getElementById('voice'),
        rateEl=document.getElementById('rate'), rateVal=document.getElementById('rateVal'),
        statusEl=document.getElementById('status'), playBtn=document.getElementById('playBtn'),
        progressWrap=document.getElementById('progressWrap'), progressBar=document.getElementById('progressBar');
  let queue=[], playing=false, audio=null, engine='google';

  rateEl.addEventListener('input',()=>rateVal.textContent=parseFloat(rateEl.value).toFixed(2)+'×');

  function chunkText(text,maxLen=180){
    const chunks=[];
    const sentences=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];
    let cur='';
    for(const s of sentences){
      if((cur+s).length>maxLen){ if(cur) chunks.push(cur.trim()); cur=s; }
      else cur+=s;
    }
    if(cur.trim()) chunks.push(cur.trim());
    return chunks;
  }

  function googleTtsUrl(text,voice){
    // 'tw-ob' client works from browsers; no-referrer policy on <audio> avoids rejection
    return 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+voice+
           '&q='+encodeURIComponent(text);
  }

  function playChunk(i){
    if(i>=queue.length){ playing=false; progressBar.style.width='100%'; statusEl.innerHTML='<span class="ok">✅ Finished.</span>'; return; }
    audio=new Audio();
    // KEY FIX: suppress the referrer so Google's free voice accepts the request
    audio.referrerPolicy='no-referrer';
    audio.src=googleTtsUrl(queue[i],voiceEl.value);
    audio.playbackRate=parseFloat(rateEl.value);
    progressBar.style.width=((i/queue.length)*100)+'%';
    statusEl.innerHTML='<span class="ok">🔊 Reading '+(i+1)+' of '+queue.length+'…</span>';
    audio.onended=()=>playChunk(i+1);
    audio.onerror=()=>{
      if(engine==='google'){
        // fallback: try the device's own voices (Web Speech API) — always works offline
        engine='device';
        statusEl.innerHTML='<span class="warn">⚠️ Online voice blocked — switching to phone voices.</span>';
        playDevice(queue,0);
      } else {
        statusEl.innerHTML='<span class="err">⚠️ Could not play audio. Try again or check connection.</span>';
        playing=false;
      }
    };
    audio.play().catch(()=>{});
  }

  function playDevice(chunks,i){
    if(i>=chunks.length){playing=false;statusEl.innerHTML='<span class="ok">✅ Finished.</span>';return;}
    if(!('speechSynthesis' in window)){statusEl.innerHTML='<span class="err">⚠️ No voice available on this phone.</span>';playing=false;return;}
    const u=new SpeechSynthesisUtterance(chunks[i]);
    u.rate=parseFloat(rateEl.value);
    const lang=voiceEl.value;
    const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang));
    if(v)u.voice=v;
    progressBar.style.width=((i/chunks.length)*100)+'%';
    statusEl.innerHTML='<span class="ok">🔊 Reading '+(i+1)+' of '+chunks.length+' (phone voice)…</span>';
    u.onend=()=>playDevice(chunks,i+1);
    speechSynthesis.speak(u);
  }

  function speak(){
    const raw=textEl.value.trim();
    if(!raw){statusEl.innerHTML='<span class="err">⚠️ Paste some text first.</span>';return;}
    stop();
    queue=chunkText(raw);
    if(!queue.length){statusEl.innerHTML='<span class="err">⚠️ Nothing to read.</span>';return;}
    playing=true; engine='google';
    progressWrap.style.display='block';
    progressBar.style.width='0%';
    playChunk(0);
  }

  function stop(){
    if(audio){audio.pause();audio=null;}
    if('speechSynthesis' in window) speechSynthesis.cancel();
    playing=false;
    progressWrap.style.display='none';
    statusEl.innerHTML='⏹ Stopped.';
  }

  function clearAll(){stop();textEl.value='';statusEl.innerHTML='Cleared.';textEl.focus();}

  function loadSample(){
    textEl.value="Hello Frederick. This is your text reader, now working on your phone with no setup at all. "+
      "Long articles, reports, and book chapters are easier on the ears than on the eyes. "+
      "Choose your voice, adjust the speed, and press listen. "+
      "Add this page to your home screen and it works like an app. "+
      "Enjoy the gift of listening. This was made for you.";
    statusEl.innerHTML='✨ Sample loaded — press Listen.';
  }
</script>
</body>
</html>
